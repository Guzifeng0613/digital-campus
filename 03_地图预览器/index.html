<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>北化昌平校区 · 星露谷式像素数字校园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316203a'/%3E%3Cpath d='M16 5 L29 12 L16 19 L3 12 Z' fill='%236aa84f'/%3E%3Cpath d='M16 5 L29 12 L16 19 L16 12 Z' fill='%235b9344'/%3E%3Crect x='12' y='11' width='8' height='7' fill='%23c0504d'/%3E%3Cpath d='M11 11 L16 7 L21 11 Z' fill='%23e8766b'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; -webkit-touch-callout:none;
    background:radial-gradient(120% 120% at 50% 38%, #1b2740 0%, #101827 55%, #0b101a 100%);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none; }
  #game { display:block; width:100vw; height:100vh; cursor:grab; image-rendering:pixelated; touch-action:none; }
  #game.dragging { cursor:grabbing; }

  .hud { position:fixed; z-index:10; color:#e9f0ff; }
  #title {
    top:16px; left:16px; padding:12px 16px; border-radius:12px;
    background:rgba(18,26,38,.82); backdrop-filter:blur(6px);
    border:1px solid rgba(120,170,255,.25); box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  #title h1 { font-size:16px; font-weight:700; letter-spacing:.5px; }
  #title .sub { margin-top:4px; font-size:12px; color:#9fb4d8; }

  #help {
    bottom:16px; left:262px; padding:10px 14px; font-size:12px; line-height:1.9;
    border-radius:12px; background:rgba(18,26,38,.78); backdrop-filter:blur(6px);
    border:1px solid rgba(120,170,255,.2); color:#c8d6ee;
  }
  /* 较窄桌面窗口：帮助面板移到小地图上方，避免横向溢出 */
  @media (max-width:860px) {
    #help { left:16px; bottom:178px; }
  }
  #help b { color:#ffd27a; }
  .key { display:inline-block; min-width:18px; padding:0 4px; margin:0 1px; text-align:center;
    border-radius:4px; background:#2b3a52; border:1px solid #42587a; font-size:11px; color:#fff; }

  #btns { top:16px; right:16px; display:flex; gap:8px; }
  .btn {
    padding:9px 14px; border-radius:10px; cursor:pointer; font-size:13px; color:#e9f0ff;
    background:rgba(28,40,58,.9); border:1px solid rgba(120,170,255,.3);
    transition:background .15s;
  }
  .btn:hover { background:rgba(46,66,96,.95); }
  .btn.active { background:#2d6cdf; border-color:#6ea8ff; }

  #loading {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#0f141b; color:#cfe0ff;
    transition:opacity .32s ease;
  }
  .spinner { width:42px; height:42px; border:4px solid #2a3a52; border-top-color:#5b9bff;
    border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading .pct { font-size:13px; color:#8fa6cc; }
  #loading .pbar { width:220px; height:8px; border-radius:6px; background:#22304a; overflow:hidden; }
  #loading .pfill { width:0%; height:100%; border-radius:6px;
    background:linear-gradient(90deg,#4f86e8,#7fb0ff); transition:width .25s ease; }

  /* 开场：标题居中放大淡入，UI 渐显 */
  #introOverlay {
    position:fixed; inset:0; z-index:40; pointer-events:none; opacity:0;
    transition:opacity .4s ease;
    background:radial-gradient(ellipse at center, rgba(10,16,26,0) 40%, rgba(8,12,20,.55) 100%);
  }
  #introOverlay.show { opacity:1; }
  .intro-skip {
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#aebfdd; letter-spacing:1px;
    animation:skipPulse 1.6s ease-in-out infinite;
  }
  @keyframes skipPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  /* 开场期间标题在屏幕中央放大 */
  #title.intro-title {
    top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; padding:22px 34px; border-radius:18px;
    background:rgba(14,22,34,.72);
    animation:titlePop 1.1s cubic-bezier(.2,.9,.25,1.2) both;
  }
  #title.intro-title h1 { font-size:26px; }
  #title.intro-title .sub { font-size:14px; }
  @keyframes titlePop {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.85);}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1);}
  }
  /* 开场期间隐藏其余 HUD，结束后渐显 */
  body.introing #btns, body.introing #help, body.introing #helpMobile,
  body.introing #minimapWrap, body.introing #joyZone { opacity:0; pointer-events:none; }
  #btns, #help, #helpMobile, #minimapWrap, #joyZone { transition:opacity .6s ease; }
  /* 移动端开场：标题缩小、上移，露出下方校园 */
  @media (max-width:640px) {
    #title.intro-title {
      top:26%; padding:14px 20px; border-radius:14px;
    }
    #title.intro-title h1 { font-size:18px; }
    #title.intro-title .sub { font-size:11px; }
  }

  #info {
    position:fixed; z-index:20; right:16px; top:70px; width:300px; max-width:calc(100vw - 32px);
    border-radius:14px; overflow:hidden; background:rgba(18,26,38,.93); backdrop-filter:blur(8px);
    border:1px solid rgba(120,170,255,.3); box-shadow:0 12px 40px rgba(0,0,0,.5);
    transform:translateX(calc(100% + 40px)); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  #info.show { transform:translateX(0); }
  #info .head { padding:14px 16px; background:linear-gradient(135deg,#2d6cdf,#1d4a9e); }
  #info .no { font-size:12px; opacity:.85; }
  #info .nm { font-size:18px; font-weight:700; margin-top:2px; }
  #info .body { padding:14px 16px; font-size:13px; line-height:1.7; color:#cdd9ee; }
  #info .tag { display:inline-block; margin-bottom:8px; padding:2px 9px; font-size:11px; border-radius:20px;
    background:rgba(91,155,255,.18); border:1px solid rgba(91,155,255,.4); color:#9cc4ff; }
  #info .close { position:absolute; top:10px; right:12px; cursor:pointer; font-size:20px; color:#dce8ff; line-height:1; }
  #hint { position:fixed; bottom:16px; right:16px; z-index:10; font-size:12px; color:#7f93b8;
    background:rgba(18,26,38,.6); padding:6px 10px; border-radius:8px; }
  #info .photo { margin:4px 16px 12px; height:172px; border-radius:10px; overflow:hidden;
    background:linear-gradient(165deg,#dfe9f4,#e7f0e4 72%);
    border:1px solid rgba(120,170,255,.2); display:flex; align-items:flex-end; justify-content:center; }
  #info .photo img { max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated;
    filter:drop-shadow(0 6px 8px rgba(40,60,90,.25)); }
  .btn-row { display:flex; gap:8px; margin-top:12px; }
  .goto-btn, .enter-btn { flex:1; padding:9px 0; border-radius:9px; cursor:pointer;
    font-size:13px; color:#fff; border:1px solid; transition:background .15s; }
  .goto-btn { background:#2d6cdf; border-color:#6ea8ff; }
  .goto-btn:hover { background:#3a7ef0; }
  .enter-btn { background:#2e9e5b; border-color:#6fd697; }
  .enter-btn:hover { background:#37b369; }
  .goto-btn.solo { flex:1; }
  #navTip { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px); z-index:15;
    font-size:13px; color:#dce8ff; background:rgba(18,26,38,.92); border:1px solid rgba(120,170,255,.3);
    padding:8px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:all .2s; }
  #navTip.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 进入场地横幅 */
  #enterBanner { position:fixed; top:16%; left:50%; transform:translate(-50%,-14px); z-index:18;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; }
  #enterBanner.show { opacity:1; transform:translate(-50%,0); }
  #enterBanner .eb-t { display:inline-block; font-size:26px; font-weight:800; letter-spacing:2px; color:#fff;
    text-shadow:0 2px 0 rgba(16,36,26,.65),0 0 24px rgba(120,255,170,.4);
    background:rgba(18,34,28,.62); padding:9px 24px; border-radius:14px;
    border:1px solid rgba(140,230,170,.45); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  #enterBanner .eb-s { margin-top:9px; font-size:13px; color:#bfe8cd;
    text-shadow:0 1px 3px rgba(0,0,0,.6); }
  /* 室内黑屏淡入淡出 */
  #fadeOverlay { position:fixed; inset:0; z-index:40; background:#000; opacity:0;
    pointer-events:none; transition:opacity .42s ease; }
  #fadeOverlay.show { opacity:1; }
  /* 室内顶部 HUD */
  #interiorHud { position:fixed; top:0; left:0; right:0; z-index:20; display:none;
    text-align:center; padding:14px 0 18px;
    background:linear-gradient(to bottom, rgba(12,18,16,.72), rgba(12,18,16,0)); }
  #interiorHud.show { display:block; }
  #interiorHud .ih-name { font-size:22px; font-weight:800; letter-spacing:2px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.5); }
  #interiorHud .ih-tip { margin-top:5px; font-size:12px; color:#cfe6d6; }
  #exitBtn { margin-top:10px; font-size:15px; font-weight:800; color:#fff; letter-spacing:2px;
    background:linear-gradient(to bottom,#5b8a5a,#3d6440); border:2px solid rgba(255,255,255,.35);
    border-radius:22px; padding:9px 26px; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  #exitBtn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
  #minimapWrap { position:fixed; left:16px; bottom:16px; z-index:12;
    background:rgba(18,26,38,.88); border:1px solid rgba(120,170,255,.3); border-radius:12px;
    padding:6px 8px 8px; backdrop-filter:blur(6px); box-shadow:0 6px 24px rgba(0,0,0,.4); }
  .mm-title { font-size:11px; color:#9cc4ff; margin:0 0 4px 2px; letter-spacing:.5px; }
  #minimap { width:220px; height:116px; border-radius:6px; display:block; cursor:pointer;
    background:#0d1620; }

  /* 移动端精简操作提示（桌面隐藏） */
  #helpMobile { display:none; position:fixed; top:54px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:11px; color:#c8d6ee; background:rgba(18,26,38,.66);
    padding:6px 12px; border-radius:16px; border:1px solid rgba(120,170,255,.18);
    white-space:nowrap; pointer-events:none; }

  /* 虚拟摇杆（仅触摸设备显示，右下角） */
  #joyZone { display:none; position:fixed; right:14px; bottom:14px; z-index:14;
    width:118px; height:118px; touch-action:none; }
  body.touch #joyZone { display:block; }
  #joyBase { position:absolute; right:0; bottom:0; width:106px; height:106px; border-radius:50%;
    background:rgba(18,26,38,.42); border:2px solid rgba(120,170,255,.32); }
  #joyKnob { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#7fb0ff,#2d6cdf);
    border:2px solid #a9cbff; box-shadow:0 4px 14px rgba(0,0,0,.45); transition:background .12s,border-color .12s; }
  #joyKnob.run { background:radial-gradient(circle at 35% 30%,#ffd98a,#ef8a28); border-color:#ffe1a8; }
  .btn.run-active { background:#e07d1e; border-color:#ffbd7a; }

  /* 小屏 / 手机（竖屏窄宽，或触摸设备横屏矮高） */
  @media (max-width: 820px), (pointer: coarse) and (max-height: 480px) and (orientation: landscape) {
    #title { top:10px; left:10px; padding:8px 11px; border-radius:10px; }
    #title h1 { font-size:13px; }
    #title .sub { font-size:10px; margin-top:2px; }
    #btns { top:10px; right:10px; gap:6px; }
    .btn { padding:7px 11px; font-size:12px; border-radius:9px; }
    #help { display:none; }
    #helpMobile { display:block; }
    #minimapWrap { left:10px; bottom:10px; padding:4px 6px 6px; border-radius:10px; }
    #minimap { width:148px; height:78px; }
    .mm-title { font-size:9px; margin-bottom:2px; }
    #info { width:276px; right:10px; top:62px; }
    #info .photo { height:150px; }
    #hint { display:none; }
    #enterBanner { top:13%; }
    #enterBanner .eb-t { font-size:19px; }
    #enterBanner .eb-s { font-size:11px; }
    #joyZone { right:10px; bottom:12px; width:104px; height:104px; }
    #joyBase { width:96px; height:96px; }
  }
  @media (max-width: 400px) {
    #title .sub { display:none; }
    #minimap { width:128px; height:68px; }
    #info { width:calc(100vw - 20px); }
    #helpMobile { font-size:10px; padding:5px 10px; }
  }
  /* 窄屏手机竖屏：标题独占一行，三按钮换到第二行，避免与标题重叠 */
  @media (max-width: 560px) and (orientation: portrait) {
    #title { top:8px; left:10px; padding:7px 10px; }
    #title h1 { font-size:13px; }
    #title .sub { display:none; }
    #btns { top:42px; right:10px; gap:6px; flex-wrap:nowrap; }
    .btn { padding:6px 10px; font-size:11px; border-radius:9px; white-space:nowrap; }
    #helpMobile { top:84px; }
    #info { top:86px; }
  }
  /* 手机横屏：高度紧张，压缩小地图/信息卡/摇杆 */
  @media (pointer: coarse) and (max-height: 480px) and (orientation: landscape) {
    #helpMobile { top:48px; }
    #minimap { width:120px; height:63px; }
    #info { width:300px; top:56px; max-height:calc(100vh - 64px); overflow-y:auto; }
    #info .photo { height:120px; }
    #joyZone { width:92px; height:92px; right:8px; bottom:8px; }
    #joyBase { width:84px; height:84px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">
  <div class="spinner"></div>
  <div>正在加载数字校园…</div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
  <div class="pct" id="pct">0%</div>
</div>

<div id="introOverlay">
  <div class="intro-skip">点击任意处跳过</div>
</div>

<div class="hud" id="title">
  <h1>北京化工大学 · 昌平校区</h1>
  <div class="sub">星露谷式正俯视像素校园 · 16 点位</div>
</div>

<div class="hud" id="btns">
  <div class="btn" id="btnRun" title="切换走路 / 跑步（也可按 Shift）">跑步：关</div>
  <div class="btn" id="btnFollow" title="相机跟随角色">跟随角色</div>
  <div class="btn" id="btnReset" title="重置视角">重置视角</div>
  <div class="btn" id="btnMute" title="开关音效">音效：开</div>
</div>

<div class="hud" id="help">
  <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / 方向键 <b>移动角色</b> · 按住 <span class="key">Shift</span> <b>跑步</b></div>
  <div>拖拽 <b>平移地图</b> · 滚轮 <b>缩放</b></div>
  <div>点击建筑 <b>查看点位</b>，点「前往这里」<b>自动寻路</b></div>
  <div>点击空地 <b>自动走过去</b> · 操场只能从<b>入口门</b>进入（走近自动开门）</div>
</div>
<div class="hud" id="helpMobile">单指拖动 · 点空地寻路 · 双指缩放 · 右下摇杆移动（推满=跑步）</div>
<div id="hint"></div>

<div id="minimapWrap">
  <div class="mm-title">校园导览 · 点击定位视角</div>
  <canvas id="minimap" width="220" height="116"></canvas>
</div>

<div id="info">
  <div class="head"><div class="close" id="infoClose">×</div>
    <div class="no" id="iNo"></div><div class="nm" id="iName"></div>
  </div>
  <div class="photo"><img id="iImg" alt=""></div>
  <div class="body">
    <span class="tag" id="iTag"></span>
    <div id="iDesc"></div>
    <div class="btn-row">
      <button class="enter-btn" id="btnEnter" style="display:none;">进入建筑</button>
      <button class="goto-btn" id="btnGoto">前往这里</button>
    </div>
  </div>
</div>

<div id="navTip"></div>

<div id="enterBanner"><div class="eb-t" id="ebTitle"></div><div class="eb-s" id="ebSub"></div></div>

<!-- 室内：黑屏淡入淡出 -->
<div id="fadeOverlay"></div>
<!-- 室内画布（独立，固定全屏） -->
<canvas id="interiorCanvas" style="display:none;position:fixed;inset:0;z-index:15;"></canvas>
<!-- 室内顶部：建筑名 + 出门提示 -->
<div id="interiorHud"><div class="ih-name" id="interiorName"></div><div class="ih-tip">走到下方门口离开，或点击下方按钮</div><button id="exitBtn">离开建筑</button></div>

<div id="joyZone">
  <div id="joyBase"><div id="joyKnob"></div></div>
</div>

<script src="js/data.js?v=v21"></script>
<script src="js/topdown_data.js?v=v21"></script>
<script src="js/main.js?v=v21"></script>
</body>
</html>
